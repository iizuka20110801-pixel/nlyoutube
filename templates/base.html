<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
:root{--bg:#0d0d10;--panel:#16161c;--line:#26262f;--fg:#ececf1;--dim:#9a9aa8;--acc:#ff3d5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(13,13,16,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px;white-space:nowrap}
.logo span{color:var(--acc)}
form.s{flex:1;display:flex;gap:8px;max-width:640px}
input[type=search]{flex:1;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#1c1c23;color:var(--fg);font-size:14px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
button{cursor:pointer;border:0;border-radius:999px;padding:9px 16px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
nav{display:flex;gap:6px;overflow:auto;padding:8px 16px;border-bottom:1px solid var(--line)}
nav a{padding:6px 12px;border-radius:999px;background:var(--panel);color:var(--dim);font-size:13px;white-space:nowrap}
nav a.on{background:var(--acc);color:#fff}
main{max-width:1400px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px 14px}
.card{display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#22222b}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);padding:1px 6px;border-radius:5px;font-size:11px;font-weight:700}
.ttl{font-weight:700;font-size:13.5px;margin:7px 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.av{width:22px;height:22px;border-radius:50%;background:#333;object-fit:cover}
footer{padding:32px 16px;text-align:center;color:var(--dim);font-size:12px;border-top:1px solid var(--line);margin-top:40px}
h1{font-size:18px;margin:0 0 14px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--panel);color:var(--dim);font-size:12px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header>
  <a class="logo" href="/">んょし<span>tube</span></a>
  <form class="s" action="/search" method="get">
    <input type="search" name="q" placeholder="検索" value="{{ q|default('') }}" autocomplete="off" id="q">
    <button type="submit">検索</button>
  </form>
</header>
<nav>
  <a href="/" class="{{ 'on' if tab=='home' else '' }}">ホーム</a>
  <a href="/trending?type=Music" class="{{ 'on' if tab=='trending' else '' }}">急上昇</a>
  <a href="/trending?type=Gaming">ゲーム</a>
  <a href="/trending?type=News">ニュース</a>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer>んょしtube — Invidious / Piped / Sia / Sennin 高速集約</footer>
{% block script %}{% endblock %}
</body>
</html>
