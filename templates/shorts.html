{% extends "base.html" %}
{% block title %}{{ v.title }} - んょしtube{% endblock %}
{% block head %}
<style>
.frame{max-width:420px;margin:0 auto;aspect-ratio:9/16;background:#000;border-radius:16px;overflow:hidden}
.frame iframe{width:100%;height:100%;border:0}
</style>
{% endblock %}
{% block content %}
<div class="frame"><iframe src="{{ nocookie }}?autoplay=1&loop=1" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
<h1 style="text-align:center;margin-top:14px">{{ v.title }}</h1>
<div class="meta" style="justify-content:center">
  {% if v.authorId %}<a href="/channel/{{ v.authorId }}">{{ v.author }}</a>{% endif %}
  <span>{{ v.views }} 回視聴</span>
</div>
{% endblock %}
